<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/fonts.css" />
    <link rel="stylesheet" href="styles/background.css" />
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/mobile.css" />
    <link rel="stylesheet" href="styles/fullscreen.css" />
    <link rel="icon" type="image/png" href="img/favicon.png" />
    <title>El Pollo Loco</title>
    <script src="classes/drawable-object.class.js"></script>
    <script src="classes/movable-object.class.js"></script>
    <script src="classes/enemy.class.js"></script>
    <script src="classes/chicken.class.js"></script>
    <script src="classes/small-chicken.class.js"></script>
    <script src="classes/endboss.class.js"></script>
    <script src="classes/character.class.js"></script>
    <script src="classes/collectable.class.js"></script>
    <script src="classes/bottle.class.js"></script>
    <script src="classes/coin.class.js"></script>
    <script src="classes/throwable-object.class.js"></script>
    <script src="classes/cloud.class.js"></script>
    <script src="classes/background-object.class.js"></script>
    <script src="classes/status-bar.class.js"></script>
    <script src="classes/counter-icon.class.js"></script>
    <script src="classes/hud.class.js"></script>
    <script src="classes/start-screen.class.js"></script>
    <script src="classes/game-over-screen.class.js"></script>
    <script src="classes/win-screen.class.js"></script>
    <script src="classes/level.class.js"></script>
    <script src="classes/keyboard.class.js"></script>
    <script src="classes/sound-manager.class.js"></script>
    <script src="classes/world.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="js/language.js"></script>
    <script src="js/script.js"></script>
  </head>
  <body onload="init()">
    <h1><span class="hover-effect" style="--hover-scale: 1.04">El Pollo loco</span></h1>

    <div class="game-area">
      <canvas class="hover-effect" id="canvas" width="720" height="480"> </canvas>
      <!-- Only available before the game starts -->
      <div id="menuButtons" class="menu-buttons">
        <button id="startButton" class="menu-button menu-button--primary" data-i18n="start" onclick="startGame()">Start</button>
        <div class="menu-side">
          <button class="menu-button" data-i18n="info" onclick="openInfo()">Info</button>
          <button id="storyButton" class="menu-button" data-i18n="story" onclick="toggleStory()">Story</button>
        </div>
      </div>
      <!-- Only visible when the game is won or lost -->
      <div id="endButtons" class="menu-buttons" hidden>
        <button class="menu-button menu-button--primary" data-i18n="restart" onclick="restartGame()">Restart</button>
        <button class="menu-button" data-i18n="leave" onclick="leaveGame()">Leave game</button>
      </div>
      <!-- Only on the start screen: language of all texts, saved in the local storage -->
      <div id="languageSwitch" class="language-switch" role="group" data-i18n-aria="language" aria-label="Language">
        <button class="language-button" data-lang="en" onclick="setLanguage('en')">EN</button>
        <button class="language-button" data-lang="de" onclick="setLanguage('de')">DE</button>
        <button class="language-button" data-lang="es" onclick="setLanguage('es')">ES</button>
      </div>
      <!-- Always visible: mutes all sounds, the state is saved in the local storage -->
      <button id="muteButton" class="mute-button" onclick="toggleMute()" data-i18n-aria="mute" aria-label="Mute sounds">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="speaker" d="M3 9v6h4l5 4V5L7 9H3z" />
          <path class="waves" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" />
          <line class="slash" x1="3" y1="3" x2="21" y2="21" />
        </svg>
      </button>
      <!-- Only while the game runs: back to the start screen -->
      <button id="abortButton" class="mute-button abort-button" onclick="leaveGame()" data-i18n-aria="abort" aria-label="Abort game" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="waves" d="M5 5l14 14M19 5L5 19" />
        </svg>
      </button>
      <!-- Switches the game area to fullscreen and back (hidden if the browser cannot do it) -->
      <button id="fullscreenButton" class="mute-button fullscreen-button" onclick="toggleFullscreen()" data-i18n-aria="fullscreen" aria-label="Fullscreen" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="waves" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" />
        </svg>
      </button>
      <!-- Only on tablets and phones, and only while the game runs -->
      <div id="touchControls" class="touch-controls" oncontextmenu="return false" hidden>
        <div class="touch-group">
          <button class="touch-button" data-key="LEFT" data-i18n-aria="runLeft" aria-label="Run left">&larr;</button>
          <button class="touch-button" data-key="RIGHT" data-i18n-aria="runRight" aria-label="Run right">&rarr;</button>
        </div>
        <div class="touch-group">
          <button class="touch-button" data-key="D" data-i18n-aria="throwBottle" aria-label="Throw bottle">
            <img src="img/6_salsa_bottle/salsa_bottle.webp" alt="" draggable="false" />
          </button>
          <button class="touch-button" data-key="SPACE" data-i18n-aria="jumpUp" aria-label="Jump">&uarr;</button>
        </div>
      </div>
      <!-- Inside the game area, so it is also visible in fullscreen -->
      <dialog id="infoDialog" class="info-dialog" onclick="closeInfoOnBackdrop(event)">
        <div class="info-content">
          <button class="info-close" onclick="closeInfo()" data-i18n-aria="close" aria-label="Close">&times;</button>
          <h2 data-i18n="controls">Controls</h2>
          <table>
            <tr>
              <td>&larr; / &rarr;</td>
              <td data-i18n="run">Run</td>
            </tr>
            <tr>
              <td>Space</td>
              <td data-i18n="jump">Jump</td>
            </tr>
            <tr>
              <td>D</td>
              <td data-i18n="throw">Throw bottle</td>
            </tr>
          </table>
          <a class="impressum-link-dialog" href="impressum.html" data-i18n="impressum">Impressum</a>
        </div>
      </dialog>
    </div>

    <!-- Portrait mode on tablets and phones: the game only works in landscape -->
    <div class="rotate-message">
      <span class="rotate-arrow">&#8635;</span>
      <span data-i18n="rotate">Turn your device to play</span>
    </div>

    <a class="impressum-link" href="impressum.html" data-i18n="impressum">Impressum</a>
  </body>
</html>
