<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      @font-face {
        font-family: 'Zabars';
        src: url('fonts/Zabars.ttf') format('truetype');
      }

      body {
        font-family: 'Zabars', Arial, sans-serif;
        font-size: 24px;
        letter-spacing: 2px;
        min-height: 100vh;
        margin: 0;
      }

      /* Blurred, darkened game background as page background (own layer, so only the image is blurred) */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: -1;
        background: url('img/5_background/second_half_background.png') center / cover no-repeat;
        filter: blur(8px) brightness(0.6);
        transform: scale(1.05); /* hides the soft blur edges */
      }

      /* Heading sits in the top third of the window, the canvas stays in the middle */
      h1 {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 33.333vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 56px;
        letter-spacing: 4px;
        /* Same yellow with brown outline as the game title */
        color: #ffd500;
        -webkit-text-stroke: 6px #a0300a;
        paint-order: stroke fill;
      }

      /* Global hover effect: add class="hover-effect" to any element.
         Optional: set --hover-scale on the element to change the zoom (default 1.03). */
      .hover-effect {
        filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
        transition:
          transform 0.3s ease,
          filter 0.3s ease;
      }

      .hover-effect:hover {
        transform: scale(var(--hover-scale, 1.03));
        filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.6));
      }

      @media (min-width: 1024px) {
        h1 {
          font-size: 112px;
          letter-spacing: 8px;
        }
      }

      body {
        justify-content: center;
      }

      canvas {
        border-radius: 8px;
        --hover-scale: 1.02;
      }
    </style>
    <link rel="stylesheet" href="style.css" />
    <title>El Pollo Loco</title>
    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/bottle.class.js"></script>
    <script src="models/coin.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/status-bar.class.js"></script>
    <script src="models/counter-icon.class.js"></script>
    <script src="models/game-over-screen.class.js"></script>
    <script src="models/win-screen.class.js"></script>
    <script src="models/start-screen.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/levels/level1.js"></script>
    <script src="js/game.js"></script>
  </head>
  <body onload="init()">
    <h1><span class="hover-effect" style="--hover-scale: 1.04">El Pollo loco</span></h1>

    <canvas class="hover-effect" id="canvas" width="720" height="480"> </canvas>
  </body>
</html>
